<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Buku Saku Kakak Adek</title>
    <style>
        /* CSS OPTIMASI RESPON INSTAN */
        :root { --blue: #2563eb; --orange: #f97316; --green: #22c55e; --red: #ef4444; }
        
        * { 
            box-sizing: border-box; 
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation; /* MENCEGAH DELAY KLIK */
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            background-color: #f1f5f9; 
            margin: 0; padding: 15px; 
            display: flex; justify-content: center; 
            user-select: none; /* MENCEGAH TEKS TERSELEKSI SAAT TAP CEPAT */
        }

        .app-container { width: 100%; max-width: 400px; }
        
        .dashboard { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 20px; }
        .card { padding: 20px; border-radius: 24px; color: white; text-align: center; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        .card-kakak { background: var(--blue); }
        .card-adek { background: var(--orange); }
        .card h1 { font-size: 10px; text-transform: uppercase; margin: 0; opacity: 0.8; font-weight: 800; }
        .balance { font-size: 20px; font-weight: 900; margin-top: 5px; }

        .glass-card { background: white; padding: 20px; border-radius: 30px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); margin-bottom: 20px; }
        
        .user-toggle { display: flex; gap: 10px; margin-bottom: 20px; }
        .btn-user { 
            flex: 1; padding: 12px; border-radius: 15px; border: 2px solid #e2e8f0; 
            background: white; font-weight: bold; cursor: pointer; 
        }
        .active-kakak { border-color: var(--blue) !important; color: var(--blue); background: #eff6ff !important; }
        .active-adek { border-color: var(--orange) !important; color: var(--orange); background: #fff7ed !important; }
        
        input { 
            width: 100%; padding: 15px; border-radius: 15px; border: 1px solid #e2e8f0; 
            background: #f8fafc; font-size: 16px; margin-bottom: 10px; outline: none;
        }
        
        .action-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .btn-act { 
            padding: 18px; border: none; border-radius: 20px; color: white; 
            font-weight: 800; font-size: 14px; cursor: pointer;
        }
        .btn-in { background: var(--green); }
        .btn-out { background: var(--red); }
        
        /* EFEK TEKAN INSTAN */
        .btn-act:active, .btn-user:active { transform: scale(0.92); transition: 0.05s; }

        .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        .history-list { display: flex; flex-direction: column; gap: 10px; max-height: 300px; overflow-y: auto; }
        .hist-item { background: white; padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid #f1f5f9; }
        .indicator { width: 4px; height: 30px; border-radius: 10px; }
        .val { font-size: 14px; font-weight: 800; }
        .date { font-size: 9px; color: #cbd5e1; font-weight: 800; }

        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); align-items: center; justify-content: center; z-index: 100; padding: 20px; }
        .modal.active { display: flex; }
        .modal-content { background: white; width: 100%; max-width: 320px; border-radius: 40px; padding: 30px; text-align: center; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="dashboard">
            <div class="card card-kakak"><h1>Kakak</h1><div id="bal-kakak" class="balance">Rp 0</div></div>
            <div class="card card-adek"><h1>Adek</h1><div id="bal-adek" class="balance">Rp 0</div></div>
        </div>

        <div class="toolbar">
            <div style="display:flex; gap:10px">
                <button onclick="shareReport()" style="font-size:20px; background:none; border:none;">📤</button>
                <button onclick="copyRawData()" style="font-size:20px; background:none; border:none;">💾</button>
            </div>
            <div style="display:flex; align-items:center; gap:5px">
                <input type="date" id="check-date" onchange="showHistoryPopup()" style="margin:0; padding:5px; font-size:10px; width:auto;">
                <button id="btn-undo" onclick="undo()" style="font-size:20px; background:none; border:none;" disabled>↶</button>
            </div>
        </div>

        <div class="glass-card">
            <div class="user-toggle">
                <button onclick="setUser('kakak')" id="btn-kakak" class="btn-user active-kakak">KAKAK</button>
                <button onclick="setUser('adek')" id="btn-adek" class="btn-user">ADEK</button>
            </div>
            <input type="number" id="amount" placeholder="Jumlah Rp" inputmode="numeric">
            <input type="text" id="note" placeholder="Keterangan">
            <div class="action-btns">
                <button onclick="executeAction('in')" class="btn-act btn-in">TABUNG</button>
                <button onclick="executeAction('out')" class="btn-act btn-out">JAJAN</button>
            </div>
        </div>

        <div id="history-list" class="history-list"></div>
    </div>

    <div id="popup-history" class="modal" onclick="closeModal()">
        <div class="modal-content" onclick="event.stopPropagation()">
            <h3 id="pop-date-title"></h3>
            <div id="pop-res" style="text-align:left; font-weight:bold; margin-bottom:20px"></div>
            <button onclick="closeModal()" style="width:100%; padding:15px; border:none; border-radius:20px; background:#1e293b; color:white; font-weight:bold">TUTUP</button>
        </div>
    </div>

    <script>
        let currentUser = 'kakak';
        let historyStack = [];
        let state = JSON.parse(localStorage.getItem('bukuSaku_v6')) || { kakak: 0, adek: 0, history: [] };

        function save() {
            localStorage.setItem('bukuSaku_v6', JSON.stringify(state));
            updateDisplay();
        }

        function executeAction(type) {
            const amt = parseInt(document.getElementById('amount').value);
            const note = document.getElementById('note').value;
            if (!amt || amt <= 0) return;
            if (type === 'out' && amt > state[currentUser]) return alert("Saldo Kurang!");

            historyStack.push(JSON.stringify(state));
            const now = new Date();
            state[currentUser] += (type === 'in' ? amt : -amt);
            state.history.push({
                owner: currentUser, type, amount: amt, note: note || (type === 'in' ? 'Tabung' : 'Jajan'),
                timestamp: now.getTime(),
                displayDate: `${now.getDate()}/${now.getMonth()+1} ${now.getHours()}:${now.getMinutes().toString().padStart(2,'0')}`
            });
            save();
            document.getElementById('amount').value = '';
            document.getElementById('note').value = '';
        }

        function undo() {
            if (historyStack.length > 0) { state = JSON.parse(historyStack.pop()); save(); }
        }

        function updateDisplay() {
            document.getElementById('bal-kakak').innerText = `Rp ${state.kakak.toLocaleString('id-ID')}`;
            document.getElementById('bal-adek').innerText = `Rp ${state.adek.toLocaleString('id-ID')}`;
            document.getElementById('btn-undo').disabled = historyStack.length === 0;
            const list = document.getElementById('history-list');
            list.innerHTML = state.history.map(i => `
                <div class="hist-item">
                    <div style="display:flex; align-items:center; gap:10px">
                        <div class="indicator" style="background:${i.owner === 'kakak' ? 'var(--blue)' : 'var(--orange)'}"></div>
                        <div>
                            <div style="font-size:12px; font-weight:bold; color:${i.type === 'in' ? 'var(--green)' : 'var(--red)'}">${i.type === 'in' ? '+' : '-'} Rp ${i.amount.toLocaleString('id-ID')}</div>
                            <div style="font-size:10px; color:#94a3b8">${i.owner.toUpperCase()} - ${i.note}</div>
                        </div>
                    </div>
                    <div class="date">${i.displayDate}</div>
                </div>
            `).reverse().join('');
        }

        function setUser(u) { 
            currentUser = u; 
            document.getElementById('btn-kakak').className = 'btn-user' + (u === 'kakak' ? ' active-kakak' : '');
            document.getElementById('btn-adek').className = 'btn-user' + (u === 'adek' ? ' active-adek' : '');
        }

        function shareReport() {
            let t = `*LAPORAN BUKU SAKU*\nKakak: Rp ${state.kakak.toLocaleString('id-ID')}\nAdek: Rp ${state.adek.toLocaleString('id-ID')}`;
            window.location.href = `https://api.whatsapp.com/send?text=${encodeURIComponent(t)}`;
        }

        function copyRawData() {
            navigator.clipboard.writeText(JSON.stringify(state)).then(() => alert("Data Disalin!"));
        }

        function showHistoryPopup() {
            const dateVal = document.getElementById('check-date').value;
            const target = new Date(dateVal); target.setHours(23,59,59,999);
            let tK = 0, tA = 0;
            state.history.forEach(i => {
                if (i.timestamp <= target.getTime()) {
                    if (i.owner === 'kakak') tK += (i.type === 'in' ? i.amount : -i.amount);
                    else tA += (i.type === 'in' ? i.amount : -i.amount);
                }
            });
            document.getElementById('pop-date-title').innerText = dateVal;
            document.getElementById('pop-res').innerHTML = `Kakak: Rp ${tK.toLocaleString('id-ID')}<br>Adek: Rp ${tA.toLocaleString('id-ID')}`;
            document.getElementById('popup-history').classList.add('active');
        }

        function closeModal() { document.getElementById('popup-history').classList.remove('active'); }
        function resetData() { if (confirm("Reset Semua?")) { state = { kakak: 0, adek: 0, history: [] }; historyStack = []; save(); } }
        
        document.getElementById('check-date').value = new Date().toISOString().split('T')[0];
        updateDisplay();
    </script>
</body>
</html>
